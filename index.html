<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة البرمجة - الصف الأول الثانوي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

  <div id="app" class="w-full max-w-2xl bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mt-6">
    <div id="content" class="text-center text-slate-300">جاري التحميل...</div>
  </div>

  <script>
    // ضع بيانات مشروعك من Supabase هنا
const SUPABASE_URL = 'https://pliaszamxbbeeuhjfyww.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ezTt6H2pz8LxSV0qHzvhSQ_Rn5tpkMx';
    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const appEl = document.getElementById('app');

    let currentUser = null;
    let studentName = '';
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;
    let authMode = 'login'; // 'login' أو 'signup'

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        await loadStudentProfile();
        await startQuiz();
      } else {
        renderAuthScreen();
      }
    }

    async function loadStudentProfile() {
      const { data } = await db
        .from('profiles')
        .select('full_name')
        .eq('id', currentUser.id)
        .single();

      studentName = data?.full_name || currentUser.user_metadata?.full_name || currentUser.email;
    }

    function renderAuthScreen() {
      const isLogin = authMode === 'login';
      appEl.innerHTML = `
        <h1 class="text-2xl font-bold text-indigo-400 mb-2 text-center">منصة البرمجة - الصف الأول الثانوي</h1>
        <p class="text-slate-400 text-sm text-center mb-6">
          ${isLogin ? 'سجّل دخولك بحسابك لبدء الاختبار وحفظ نتيجتك' : 'أنشئ حساباً جديداً كطالب وابدأ التدريب'}
        </p>

        <form id="authForm" class="space-y-4">
          ${!isLogin ? `
            <div>
              <label class="block text-sm text-slate-300 mb-1">الاسم الكامل</label>
              <input id="fullName" type="text" required placeholder="مثال: كريم مجدي"
                class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500" />
            </div>
          ` : ''}

          <div>
            <label class="block text-sm text-slate-300 mb-1">البريد الإلكتروني</label>
            <input id="email" type="email" required placeholder="student@example.com"
              class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500" />
          </div>

          <div>
            <label class="block text-sm text-slate-300 mb-1">كلمة المرور</label>
            <input id="password" type="password" required minlength="6" placeholder="6 أحرف على الأقل"
              class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500" />
          </div>

          <div id="authError" class="text-rose-400 text-sm hidden"></div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold transition">
            ${isLogin ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
          ${isLogin ? 'ليس لديك حساب؟' : 'لديك حساب بالفعل؟'}
          <button id="toggleAuth" class="text-indigo-400 hover:underline font-semibold mr-1">
            ${isLogin ? 'إنشاء حساب' : 'تسجيل الدخول'}
          </button>
        </div>
      `;

      document.getElementById('toggleAuth').addEventListener('click', () => {
        authMode = isLogin ? 'signup' : 'login';
        renderAuthScreen();
      });

      document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('fullName')?.value.trim();
        const errorBox = document.getElementById('authError');
        errorBox.classList.add('hidden');

        if (!isLogin) {
          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName } }
          });
          if (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove('hidden');
            return;
          }
          if (!data.session) {
            errorBox.className = 'text-emerald-400 text-sm';
            errorBox.textContent = 'تم إنشاء الحساب! راجع بريدك الإلكتروني لتفعيل الحساب ثم سجل الدخول.';
            errorBox.classList.remove('hidden');
            return;
          }
          currentUser = data.user;
          await loadStudentProfile();
          await startQuiz();
        } else {
          const { data, error } = await db.auth.signInWithPassword({ email, password });
          if (error) {
            errorBox.textContent = 'بيانات الدخول غير صحيحة أو الحساب غير مفعّل.';
            errorBox.classList.remove('hidden');
            return;
          }
          currentUser = data.user;
          await loadStudentProfile();
          await startQuiz();
        }
      });
    }

    async function startQuiz() {
      currentIndex = 0;
      score = 0;
      selectedOption = null;

      appEl.innerHTML = `<div class="text-center text-slate-300 py-8">جاري تحميل الأسئلة...</div>`;
      const { data, error } = await db.from('questions').select('*').order('id', { ascending: true });

      if (error) {
        appEl.innerHTML = `<p class="text-rose-400 text-center">خطأ في تحميل الأسئلة: ${error.message}</p>`;
        return;
      }

      questions = data || [];
      if (questions.length === 0) {
        appEl.innerHTML = `<p class="text-center">لا توجد أسئلة مضافة حالياً.</p>`;
        return;
      }

      renderQuestion();
    }

    function renderQuestion() {
      if (currentIndex >= questions.length) {
        finishQuiz();
        return;
      }

      const q = questions[currentIndex];
      selectedOption = null;

      let codeBlock = q.code_snippet
        ? `<pre dir="ltr" class="bg-slate-950 p-3 rounded text-emerald-400 font-mono mb-4 text-left overflow-x-auto border border-slate-800">${q.code_snippet}</pre>`
        : '';

      let optionsHtml = ['a', 'b', 'c', 'd'].map(letter => {
        const upper = letter.toUpperCase();
        return `
          <button data-opt="${upper}" class="opt-btn w-full p-3 text-right bg-slate-700 hover:bg-slate-600 rounded-lg border border-slate-600 transition flex items-center gap-3">
            <span class="font-bold bg-slate-900 px-2.5 py-0.5 rounded text-sm">${upper}</span>
            <span>${q[`option_${letter}`]}</span>
          </button>
        `;
      }).join('');

      appEl.innerHTML = `
        <div class="flex flex-wrap justify-between items-center gap-2 pb-4 mb-4 border-b border-slate-700">
          <div>
            <h1 class="text-lg font-bold text-indigo-400">منصة البرمجة - أولى ثانوي</h1>
            <p class="text-xs text-slate-400">مرحباً، <span class="text-slate-200 font-semibold">${studentName}</span></p>
          </div>
          <div class="flex items-center gap-2">
            <span class="bg-indigo-900 text-indigo-200 px-3 py-1 rounded-full text-sm">النقاط: ${score}</span>
            <button id="logoutBtn" class="text-xs bg-slate-700 hover:bg-rose-600 px-3 py-1.5 rounded-lg transition">خروج</button>
          </div>
        </div>

        <div class="text-slate-400 text-sm mb-3">السؤال ${currentIndex + 1} من ${questions.length}</div>
        <h2 class="text-xl font-semibold mb-4 text-right">${q.title}</h2>
        ${codeBlock}
        <div class="space-y-3 mb-4">${optionsHtml}</div>
        <div id="feedback" class="hidden p-4 rounded-lg bg-slate-900 border border-slate-700 mb-4"></div>
        <button id="nextBtn" class="hidden w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold transition">
          ${currentIndex + 1 === questions.length ? 'إنهاء وحفظ النتيجة' : 'السؤال التالي ←'}
        </button>
      `;

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await db.auth.signOut();
        currentUser = null;
        renderAuthScreen();
      });

      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (selectedOption) return;
          selectedOption = btn.getAttribute('data-opt');
          const isCorrect = selectedOption === q.correct_option;
          if (isCorrect) score++;

          document.querySelectorAll('.opt-btn').forEach(b => {
            const opt = b.getAttribute('data-opt');
            b.disabled = true;
            if (opt === q.correct_option) {
              b.className = b.className.replace('bg-slate-700 hover:bg-slate-600', 'bg-emerald-600');
            } else if (opt === selectedOption) {
              b.className = b.className.replace('bg-slate-700 hover:bg-slate-600', 'bg-rose-600');
            } else {
              b.className += ' opacity-50';
            }
          });

          const feedback = document.getElementById('feedback');
          feedback.innerHTML = `
            <p class="font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'} mb-1">
              ${isCorrect ? 'إجابة صحيحة!' : `إجابة خاطئة — الإجابة الصحيحة هي (${q.correct_option})`}
            </p>
            ${q.explanation ? `<p class="text-slate-300 text-sm">${q.explanation}</p>` : ''}
          `;
          feedback.classList.remove('hidden');
          document.getElementById('nextBtn').classList.remove('hidden');
        });
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        currentIndex++;
        renderQuestion();
      });
    }

    async function finishQuiz() {
      appEl.innerHTML = `<div class="text-center text-slate-300 py-8">جاري حفظ نتيجتك...</div>`;

      const { error: insertError } = await db.from('quiz_results').insert({
        student_id: currentUser.id,
        score: score,
        total_questions: questions.length
      });

      const { data: history } = await db
        .from('quiz_results')
        .select('score, total_questions, created_at')
        .eq('student_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(5);

      const historyRows = (history || []).map(row => {
        const dateStr = new Date(row.created_at).toLocaleDateString('ar-EG');
        return `
          <div class="flex justify-between items-center bg-slate-900/70 px-4 py-2.5 rounded-lg border border-slate-700/70 text-sm">
            <span class="text-slate-400">${dateStr}</span>
            <span class="font-bold text-indigo-300">${row.score} / ${row.total_questions}</span>
          </div>
        `;
      }).join('');

      appEl.innerHTML = `
        <div class="text-center">
          <h2 class="text-3xl font-bold mb-2 text-emerald-400">أحسنت يا ${studentName}!</h2>
          <p class="text-xl mb-2">درجتك في هذا الاختبار: <span class="font-bold text-indigo-300">${score} من ${questions.length}</span></p>
          ${insertError
            ? `<p class="text-xs text-rose-400 mb-4">تنبيه: لم يتم حفظ النتيجة (${insertError.message})</p>`
            : `<p class="text-xs text-emerald-400 mb-6">تم حفظ نتيجتك في حسابك بنجاح</p>`}
        </div>

        <div class="mb-6">
          <h3 class="text-sm font-bold text-slate-300 mb-3">آخر نتائجك المحفوظة:</h3>
          <div class="space-y-2">${historyRows || '<p class="text-slate-400 text-sm">لا توجد نتائج سابقة.</p>'}</div>
        </div>

        <div class="flex gap-3">
          <button id="retryBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold transition">إعادة الاختبار</button>
          <button id="logoutEndBtn" class="bg-slate-700 hover:bg-rose-600 px-5 py-3 rounded-lg font-bold transition">خروج</button>
        </div>
      `;

      document.getElementById('retryBtn').addEventListener('click', startQuiz);
      document.getElementById('logoutEndBtn').addEventListener('click', async () => {
        await db.auth.signOut();
        currentUser = null;
        renderAuthScreen();
      });
    }

    init();
  </script>
</body>
</html>
